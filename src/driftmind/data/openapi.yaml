                  summary: Unexpected internal error
                  description: InternalProcessingError
                  value:
                    error: INTERNAL_SERVER_ERROR
                    details: []
    delete:
      tags:
        - DriftMind Web Service
      summary: Removes a Forecaster Model from the library
      description: >-
        Deletes the specified forecaster model from the system. This operation
        permanently removes the forecaster model and its associated data and it
        cannot be recovered.
      operationId: delete
      parameters:
        - name: forecasterId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Forecaster deleted permanently
          content:
