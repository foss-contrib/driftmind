openapi: 3.0.1
info:
  title: DriftMind API Interface
  version: 1.0.0
servers:
  - url: 'https://api.thingbook.io/access/api'
    description: Production
  - url: /access/api
    description: Relative (same host)
security:
  - ApiKeyAuth: []
tags:
  - name: DriftMind Web Service
    description: Services for predictive forecasting and anomaly detection.
paths:
  /driftmind/v1/forecasters/observations:
    patch:
      tags:
        - DriftMind Web Service
      summary: Feed observations to multiple forecasters
      description: >-
        Appends variable series to existing forecasters. Validates input,
        charges credit, and updates Redis. Returns detailed status for each item
        in the batch.
      operationId: feedDataToForecaster
      requestBody:
        description: Batch Feed Payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultipleFeedPayload'
            examples:
              Single Forecaster:
                summary: A batch containing a single forecaster update
                value:
                  payloadsList:
                    - forecasterId: abc-123
                      data:
                        sin: [0.1, 0.2, 0.3]
                        cos: [0.9, 0.8, 0.7]
              Multiple Forecasters:
                summary: A batch containing multiple forecaster updates
                value:
                  payloadsList:
                    - forecasterId: abc-123
                      data:
                        sin: [0.4, 0.5]
                        cos: [0.6, 0.5]
                    - forecasterId: xyz-789
                      data:
                        x: [1.0, 2.0]
                        y: [3.0, 4.0]
        required: true
      responses:
        '200':
          description: All payloads processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
              examples:
                Full Success:
                  description: Full Success
                  value:
                    message: FORECASTERS_FED
                    details:
                      - forecasterId: abc-123
                        status: 200
                        message: FED
                      - forecasterId: xyz-789
                        status: 200
                        message: FED
        '206':
          description: Partial success (some payloads failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
              examples:
                Mixed Results:
                  summary: 'One success, one failure'
                  description: Mixed Results
                  value:
                    message: PARTIALLY_PROCESSED
                    details:
                      - forecasterId: abc-123
                        status: 200
                        message: FED
                      - forecasterId: bad-id-001
                        status: 404
                        message: FORECASTER_NOT_FOUND
        '417':
          description: Expectation Failed (All payloads failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
              examples:
                Total Failure:
                  description: Total Failure with different reasons
                  value:
                    message: NOT_PROCESSED
                    details:
                      - forecasterId: abc-123
                        status: 400
                        message: INCONSISTENT_ARRAY_LENGTH
                      - forecasterId: def-456
                        status: 400
                        message: MISSING_COLUMN_sin
                      - forecasterId: bad-id-001
                        status: 404
                        message: FORECASTER_NOT_FOUND
                Internal Storage Failure:
                  description: Failure as a result of storage issues
                  value:
                    message: NOT_PROCESSED
                    details:
                      - forecasterId: xyz-789
                        status: 500
                        message: REDIS_UNAVAILABLE
        '500':
          description: Internal System Error (Global failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                System Crash:
                  description: System Crash
                  value:
                    error: INTERNAL_SERVER_ERROR
                    details:
                      - Database connection lost
  '/driftmind/v1/forecasters/{forecasterId}/observations':
    get:
      tags:
        - DriftMind Web Service
      summary: Get recent data from a forecaster
      description: Returns recent time series data points collected by the forecaster.
      operationId: getRecentData
      parameters:
        - name: forecasterId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Forecaster data queue retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecasterData'
              examples:
                Empty Response:
                  description: The forecaster hasn't been fed yet
                  value:
                    data: {}
                Regular Response:
                  description: The forecaster has been properly fed
                  value:
                    data:
                      '01/05/2024 00:04:00':
                        temperature: 42.9
                        humidity: 77.2
                      '01/05/2024 00:05:00':
                        temperature: 42.5
                        humidity: 77.1
                      '01/05/2024 00:06:00':
                        temperature: 38.2
                        humidity: 75.0
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: TOKEN_REJECTED
                details: []
        '402':
          description: Insufficient credit to perform the requested operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: CREDIT_EXHAUSTED
                details: []
        '403':
          description: Access rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: ACCESS_REJECTED
                details: []
        '404':
          description: Forecaster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: FORECASTER_NOT_FOUND
                details: []
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                CreditAccountingFailure:
                  summary: Credit record could not be written
                  description: CreditAccountingFailure
                  value:
                    error: CREDIT_RECORD_INSERT_FAILED
                    details: []
                RedisUnavailable:
                  summary: Redis is unavailable or failed during access
                  description: RedisUnavailable
                  value:
                    error: REDIS_UNAVAILABLE
                    details: []
                ForecasterCorrupted:
                  summary: Forecaster object is corrupted or inconsistent
                  description: ForecasterCorrupted
                  value:
                    error: FORECASTER_CORRUPTED
                    details: []
                InternalProcessingError:
                  summary: Unexpected internal error
                  description: InternalProcessingError
                  value:
                    error: INTERNAL_SERVER_ERROR
                    details: []
    post:
      tags:
        - DriftMind Web Service
      summary: Feed a specific forecaster
      description: >-
        Targeted feed for a single forecaster. Accepts a map of variable names
        to data arrays. Returns a simple status message on success.
      operationId: feedSpecificForecaster
      parameters:
        - name: forecasterId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Map of variable names to aligned observation arrays.
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: array
                items:
                  type: number
                  format: double
            examples:
              Simple Example:
                description: Simple Example
                value:
                  temperature:
                    - 0.841470985
                    - 0.909297427
                    - 0.141120008
                    - -0.756802495
                    - -0.958924275
                  humidity:
                    - 0.540302306
                    - -0.416146837
                    - -0.989992497
                    - -0.653643621
                    - 0.283662185
                  pressure:
                    - 0.982188275
                    - 0.473403417
                    - -0.750535789
                    - -0.987171428
                    - -0.62510191
        required: true
      responses:
        '200':
          description: Payload successfully fed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
              examples:
                Success:
                  description: Success
                  value:
                    message: FORECASTER_FED
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                Array Mismatch:
                  summary: Columns have different lengths
                  description: Array Mismatch
                  value:
                    error: BAD_REQUEST
                    details:
                      - >-
                        column pressure has inconsistent data array length.
                        expected: 5, found: 4
                Missing Column:
                  summary: Payload lacks required feature
                  description: Missing Column
                  value:
                    error: BAD_REQUEST
                    details:
                      - missing column sin
                Invalid Payload:
                  summary: Payload does not follow the format or is wrong JSON
                  description: Invalid Payload
                  value:
                    error: BAD_REQUEST
                    details:
                      - >-
                        Request body could not be parsed. Please ensure it is
                        valid JSON and adheres to the expected schema
        '404':
          description: Forecaster Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                Not Found:
                  description: Not Found
                  value:
                    error: FORECASTER_NOT_FOUND
                    details: []
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                System Failure:
                  description: System Failure
                  value:
                    error: INTERNAL_PROCESSING_ERROR
                    details:
                      - Redis unavailable
  /driftmind/v1/forecasters:
    get:
      tags:
        - DriftMind Web Service
      summary: Returns a list of forecasters owned by the authenticated customer.
      description: Retrieves a list of all forecasters owned by the authenticated customer.
      operationId: returnForecasterList
      responses:
        '200':
          description: Successfully retrieved the list of forecasters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectInformation'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: TOKEN_REJECTED
                details: []
        '402':
          description: Insufficient credit to perform the requested operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: CREDIT_EXHAUSTED
                details: []
        '403':
          description: Access rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: ACCESS_REJECTED
                details: []
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                CreditAccountingFailure:
                  summary: Credit record could not be written
                  description: CreditAccountingFailure
                  value:
                    error: CREDIT_RECORD_INSERT_FAILED
                    details: []
                RedisUnavailable:
                  summary: Redis is unavailable or failed during access
                  description: RedisUnavailable
                  value:
                    error: REDIS_UNAVAILABLE
                    details: []
                ForecasterCorrupted:
                  summary: Forecaster object is corrupted or inconsistent
                  description: ForecasterCorrupted
                  value:
                    error: FORECASTER_CORRUPTED
                    details: []
                InternalProcessingError:
                  summary: Unexpected internal error
                  description: InternalProcessingError
                  value:
                    error: INTERNAL_SERVER_ERROR
                    details: []
    post:
      tags:
        - DriftMind Web Service
      summary: Create a new DriftMind Forecaster
      description: >-
        Creates a new multivariate forecaster owned by the authenticated
        customer.
      operationId: createPredictor
      requestBody:
        description: >-
          Creation payload containing the forecaster's name and feature list.
          Features must be unique, non-empty strings.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForecasterCreation'
            examples:
              SmartCity_Environmental_Zone_A:
                summary: Smart City – Environmental Sensor Forecaster
                description: SmartCity_Environmental_Zone_A
                value:
                  forecasterName: Environmental Sensor Forecaster
                  features:
                    - temperature
                    - humidity
                    - pressure
                  inputSize: 30
                  outputSize: 1
              SmartCity_AirQuality:
                summary: Smart City – Air Quality Forecaster
                description: SmartCity_AirQuality
                value:
                  forecasterName: Air Quality Multivariate Forecaster
                  features:
                    - pm2_5
                    - co_ppm
                    - temperature_c
                  inputSize: 50
                  outputSize: 10
                  timeStampIntervalInSeconds: 3600
              IndustrialIoT_MachineHealth:
                summary: Industrial IoT – Machine Health Forecaster
                description: IndustrialIoT_MachineHealth
                value:
                  forecasterName: Machine Health Forecaster
                  features:
                    - vibration_g
                    - motor_temp_c
                    - power_kw
                  inputSize: 30
                  outputSize: 1
                  maxClustersAllowed: 50
                  similarityThreshold: 0.8
                  timeStampIntervalInSeconds: 30
                  fitRate: 1
                  useCustomDateFormat: true
                  dateFormat: 'dd-MM-yyyy HH:mm'
                  useInitializationDate: true
                  initializationDate: '01-01-2025 00:00'
              SmartCity_TrafficFlow:
                summary: Smart City – Traffic Flow Forecaster
                description: SmartCity_TrafficFlow
                value:
                  forecasterName: Traffic Flow Forecaster
                  features:
                    - vehicle_count
                    - avg_speed_kmh
                    - congestion_index
                  inputSize: 50
                  outputSize: 10
                  timeStampIntervalInSeconds: 1800
        required: true
      responses:
        '201':
          description: Forecaster successfully created
          headers:
            Location:
              description: URL of the created forecaster resource
              style: simple
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateForecasterResponse'
              example:
                features:
                  - temperature
                  - humidity
                  - pressure
                configuration:
                  fitRate: '1'
                  initializationDate: '05-01-2026 11:42:50'
                  maxClustersAllowed: '100'
                  dateFormat: 'dd-MM-yyyy HH:mm:ss'
                  similarityThreshold: '0.8'
                  timeStampIntervalInSeconds: '60'
                  outputSize: '1'
                  inputSize: '30'
                forecasterId: f4e2a5bb-9360-4802-8f6c-2211e97473b7
                forecasterName: Environmental Sensor Forecaster
        '400':
          description: Invalid input parameters or validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                Incorrect FeaturesList:
                  summary: Feature names do not match forecaster definition
                  description: Incorrect FeaturesList
                  value:
                    error: VALIDATION_FAILED
                    details:
                      - Feature list cannot be empty or found incorrect
                Missing Body:
                  summary: Request body is missing
                  description: Missing Body
                  value:
                    error: VALIDATION_FAILED
                    details:
                      - Request body is required
                Invalid Body:
                  summary: Request body is invalid
                  description: Invalid Body
                  value:
                    error: VALIDATION_FAILED
                    details:
                      - >-
                        Request body could not be parsed. Please ensure it is
                        valid JSON and adheres to the expected schema
                Invalid Window Sizes:
                  summary: Input/Output lengths are not positive integers
                  value:
                    error: VALIDATION_FAILED
                    details:
                      - Input length must be a positive integer.
                      - Output length must be a positive integer.
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: TOKEN_REJECTED
                details: []
        '402':
          description: Insufficient credit to perform the requested operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: CREDIT_EXHAUSTED
                details:
                  - creditRequiredMb=0.42
                  - creditAvailableMb=0.10
        '403':
          description: Access rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: ACCESS_REJECTED
                details: []
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                CreditAccountingFailure:
                  summary: Credit record could not be written
                  description: CreditAccountingFailure
                  value:
                    error: CREDIT_RECORD_INSERT_FAILED
                    details: []
                RedisUnavailable:
                  summary: Redis is unavailable or failed during access
                  description: RedisUnavailable
                  value:
                    error: REDIS_UNAVAILABLE
                    details: []
                InternalProcessingError:
                  summary: Unexpected internal error
                  description: InternalProcessingError
                  value:
                    error: INTERNAL_SERVER_ERROR
                    details: []
  '/driftmind/v1/forecasters/{forecasterId}':
