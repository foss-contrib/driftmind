  '/driftmind/v1/forecasters/{forecasterId}/predictions':
    get:
      tags:
        - DriftMind Web Service
      summary: Get predictions from a forecaster
      description: Returns predictions generated by the forecaster model.
      operationId: predict
      parameters:
        - name: forecasterId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Forecaster predictions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastingReturn'
              example:
                anomalyScore: 0.0
                numberOfClusters: 0
                features:
                  cos:
                    timestamps:
                      - '2026-01-31T17:31:05'
                      - '2026-01-31T17:32:05'
                    predictions:
                      - -0.4
                      - -0.5
                    upperConfidence:
                      - -0.4
                      - -0.5
                    lowerConfidence:
                      - -0.4
                      - -0.5
                    anomalyScore: 0.0
                    forecastingMethod: Naive Forecasting
                    numberOfClusters: 0
                  sin:
                    timestamps:
                      - '2026-01-31T17:32:05'
                      - '2026-01-31T17:33:05'
                    predictions:
                      - 1.3000000000000003
                      - 1.4000000000000004
                    upperConfidence:
                      - 1.2000000000000002
                      - 1.4000000000000004
                    lowerConfidence:
                      - 1.3000000000000003
                      - 1.4000000000000004
                    anomalyScore: 0.0
                    forecastingMethod: Naive Forecasting
                    numberOfClusters: 0      
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: TOKEN_REJECTED
                details: []
        '402':
          description: Insufficient credit to perform the requested operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: CREDIT_EXHAUSTED
                details: []
        '403':
          description: Access rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: ACCESS_REJECTED
                details: []
        '404':
          description: Forecaster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: FORECASTER_NOT_FOUND
                details: []
        '422':
          description: >-
            Forecaster exists but is not ready to generate forecasts
            (insufficient data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: FORECAST_NOT_READY
                details: []
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                CreditAccountingFailure:
                  summary: Credit record could not be written
                  description: CreditAccountingFailure
                  value:
                    error: CREDIT_RECORD_INSERT_FAILED
                RedisUnavailable:
                  summary: Redis is unavailable or failed during access
                  description: RedisUnavailable
                  value:
                    error: REDIS_UNAVAILABLE
                ForecasterCorrupted:
                  summary: Forecaster object is corrupted or inconsistent
                  description: ForecasterCorrupted
                  value:
                    error: FORECASTER_CORRUPTED
                InternalProcessingError:
                  summary: Unexpected internal error
                  description: InternalProcessingError
                  value:
                    error: INTERNAL_SERVER_ERROR
  /driftmind/v1:
    get:
      tags:
        - DriftMind Web Service
      summary: Returns a list of objects owned by the authenticated customer.
      description: >-
        Retrieves a list of all objects owned by the authenticated customer.
        Objects can be DataSets, Customed Clients (as Web UI or Mobile App), or
        Forecasters.
      operationId: returnObjectList
      responses:
        '200':
          description: Successfully retrieved the list of objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectInformation'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: TOKEN_REJECTED
                details: []
        '402':
          description: Insufficient credit to perform the requested operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: CREDIT_EXHAUSTED
                details: []
        '403':
          description: Access rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: ACCESS_REJECTED
                details: []
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                CreditAccountingFailure:
                  summary: Credit record could not be written
                  description: CreditAccountingFailure
                  value:
                    error: CREDIT_RECORD_INSERT_FAILED
                    details: []
                RedisUnavailable:
                  summary: Redis is unavailable or failed during access
                  description: RedisUnavailable
                  value:
                    error: REDIS_UNAVAILABLE
                    details: []
                ForecasterCorrupted:
                  summary: Forecaster object is corrupted or inconsistent
                  description: ForecasterCorrupted
                  value:
                    error: FORECASTER_CORRUPTED
                    details: []
                InternalProcessingError:
                  summary: Unexpected internal error
                  description: InternalProcessingError
                  value:
                    error: INTERNAL_SERVER_ERROR
                    details: []
components:
  schemas:
    FeedResponse:
      type: object
      properties:
        message:
          type: string
          description: Status message summary
        details:
          type: array
          description: List of validation results for each forecaster payload
          items:
            $ref: '#/components/schemas/MultiFeederSingleResponse'
    MultiFeederSingleResponse:
      type: object
      properties:
        forecasterId:
          type: string
        status:
          type: integer
          format: int32
        message:
          type: string
      description: List of validation results for each forecaster payload
    ApiError:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string
    FeedPayload:
      type: object
      properties:
        forecasterId:
          type: string
          description: Unique identifier of the forecaster previously created.
          example: forecaster-traffic-002
        data:
          type: object
          additionalProperties:
            type: array
            description: Map of variable names to aligned numeric time series arrays.
            example:
              temperature:
                - 18
                - 19.5
                - 20.1
              humidity:
                - 0.62
                - 0.6
                - 0.58
            items:
              type: number
              description: Map of variable names to aligned numeric time series arrays.
              format: double
          description: Map of variable names to aligned numeric time series arrays.
          example:
            temperature:
              - 18
              - 19.5
              - 20.1
            humidity:
              - 0.62
              - 0.6
              - 0.58
      description: Payload used to feed a multivariate time series into a forecaster.
      example:
        forecasterId: forecaster-traffic-002
        data:
          temperature:
            - 18
            - 19.5
            - 20.1
            - 20.7
          humidity:
            - 0.62
            - 0.6
            - 0.58
            - 0.59
          pressure:
            - 1012.2
            - 1012.5
            - 1012.1
            - 1011.9
    MultipleFeedPayload:
      type: object
      properties:
        payloadsList:
          type: array
          items:
            $ref: '#/components/schemas/FeedPayload'
    ApiMessage:
      type: object
      properties:
        message:
          type: string
    CreateForecasterResponse:
      type: object
      properties:
        features:
          type: array
          description: List of feature names included in the forecaster.
          example:
            - CPU_Usage
            - Memory_Usage
          items:
            type: string
            description: List of feature names included in the forecaster.
            example: '["CPU_Usage","Memory_Usage"]'
        configuration:
          type: object
          additionalProperties:
            type: string
            description: >-
              Key-value map of forecaster properties/configuration (e.g., input
              length, output length, Granularity).
            example: >-
              {"inputSize":"45","outputSize":"5","timeStampIntervalInSeconds":"60"}
          description: >-
            Key-value map of forecaster properties/configuration (e.g., input
            length, output length, Granularity).
          example:
            inputSize: '45'
            outputSize: '5'
            timeStampIntervalInSeconds: '60'
        forecasterId:
          type: string
          description: Unique identifier for the forecaster.
          example: forecast-12345
        forecasterName:
          type: string
          description: Human-readable name for the forecaster.
          example: CPU & Memory Daily Predictor
      description: Response returned when a forecaster is successfully created.
    ForecasterCreation:
      required:
        - features
        - forecasterName
        - inputSize
        - outputSize
      type: object
      properties:
        forecasterName:
          type: string
          description: Unique name for the forecaster to be created.
          example: Daily_revenue_predictor
        features:
          type: array
          description: >-
            List of feature names (columns) to be modeled. Must be non-empty and
            contain unique, non-blank strings.
          example:
            - Product Category A
            - Product Category B
            - Product Category C
          items:
            type: string
            description: >-
              List of feature names (columns) to be modeled. Must be non-empty
              and contain unique, non-blank strings.
            example: '["Product Category A","Product Category B","Product Category C"]'
        inputSize:
          minimum: 1
          type: integer
          description: Number of past time steps used as the input window.
          format: int32
          example: 30
        outputSize:
          minimum: 1
          type: integer
          description: >-
            Forecast horizon (number of future time steps to predict). Must be
            <= inputSize.
          format: int32
          example: 1
        maxClustersAllowed:
          minimum: 1
          type: integer
          description: >-
            Maximum number of clusters allowed. Impacts memory footprint and
            model complexity.
          format: int32
          example: 100
        similarityThreshold:
          maximum: 1
          minimum: 0.6
          type: number
          description: >-
            Similarity threshold for clustering. Range: 0.6 to 1.0. Recommended
            starting point: 0.8.
          format: double
          example: 0.8
        timeStampIntervalInSeconds:
          minimum: 1
          type: integer
          description: Time interval (seconds) between two consecutive data points.
          format: int32
          example: 60
        fitRate:
          minimum: 1
          type: integer
          description: >-
            Number of ingestions required to trigger a fit/update cycle. 1 means
            update on every new point.
          format: int32
          example: 1
        useCustomDateFormat:
          type: boolean
          description: >-
            If true, timestamps are provided in a custom format specified by
            dateFormat.
          example: false
        dateFormat:
          type: string
          description: Custom date format used when useCustomDateFormat is true.
          example: 'dd-MM-yyyy HH:mm:ss'
        useInitializationDate:
          type: boolean
          description: >-
            If true, the forecaster assumes a fixed initializationDate (useful
            when timestamps are not present).
          example: false
        initializationDate:
          type: string
          description: >-
            Initialization date/time used when useInitializationDate is true.
            Must match dateFormat.
          example: '01-01-2025 00:00'
      description: Configuration parameters required to create a new DriftMind forecaster.
    DriftMindObjectDetailsClass:
      type: object
      properties:
        anomalyScore:
          type: number
          format: double
        activeClusters:
          type: integer
          format: int32
        totalCreatedClusters:
          type: integer
          format: int64
        totalDeletedClusters:
          type: integer
          format: int64
        totalObservations:
          type: integer
          format: int64
        totalTimeSeriesProcessed:
          type: integer
          format: int64
        lastAddtion:
          type: string
      description: List of feature names used by the forecaster.
      example:
        - CPU_Usage
        - Memory_Usage
    ForecasterDetails:
      type: object
      properties:
        features:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DriftMindObjectDetailsClass'
          description: List of feature names used by the forecaster.
          example:
            - CPU_Usage
            - Memory_Usage
        configuration:
          type: object
          additionalProperties:
            type: string
            description: >-
              Key-value map of forecaster properties (e.g., input length, output
              length, Granularity).
            example: >-
              {"inputSize":"45","outputSize":"5","timeStampIntervalInSeconds":"60"}
          description: >-
            Key-value map of forecaster properties (e.g., input length, output
            length, Granularity).
          example:
            inputSize: '45'
            outputSize: '5'
            timeStampIntervalInSeconds: '60'
        forecasterId:
          type: string
          description: Unique identifier for the forecaster.
          example: forecast-12345
        forecasterName:
          type: string
          description: Human-readable name for the forecaster.
          example: CPU & Memory Daily Predictor
      description: Represents metadata and configuration details of a forecaster instance.
    ForecasterData:
      type: object
      description: >-
        A multivariate time series container where data is organized by timestamp.
      properties:
        data:
          type: object
          description: >-
            The time series payload. Each key is a ISO-formatted or localized 
            timestamp representing a single observation point in time.
          additionalProperties:
            type: object
            description: >-
              A map of variate names (features) to their observed numeric values 
              at this specific timestamp.
            additionalProperties:
              type: number
              format: double
              description: The numeric value for this specific variate.
      example:
        data:
          '01/05/2024 00:05:00':
            temperature: 42.5
            humidity: 77.1
          '01/05/2024 00:06:00':
            temperature: 38.2
            humidity: 75.0
    ForecastingReturn:
      type: object
      properties:
        anomalyScore:
          type: number
          description: >-
            Average anomaly score across all features for this prediction
            request (rounded to 2 decimals).
          format: double
          example: 0.27
        numberOfClusters:
          type: integer
          description: >-
            Total number of clusters across features at prediction time (sum of
            per-feature cluster counts).
          format: int32
          example: 12
        features:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SingleForecasterResult'
          description: Per-feature forecast results keyed by feature name.
      example:
        anomalyScore: 0.0
        numberOfClusters: 0
        features:
          cos:
            timestamps:
              - '2026-01-31T17:31:05'
              - '2026-01-31T17:32:05'
            predictions:
              - -0.4
              - -0.5
            upperConfidence:
              - -0.4
              - -0.5
            lowerConfidence:
              - -0.4
              - -0.5
            anomalyScore: 0.0
            forecastingMethod: Naive Forecasting
            numberOfClusters: 0
          sin:
            timestamps:
              - '2026-01-31T17:32:05'
              - '2026-01-31T17:33:05'
            predictions:
              - 1.3000000000000003
              - 1.4000000000000004
            upperConfidence:
              - 1.2000000000000002
              - 1.4000000000000004
            lowerConfidence:
              - 1.3000000000000003
              - 1.4000000000000004
            anomalyScore: 0.0
            forecastingMethod: Naive Forecasting
            numberOfClusters: 0      
      description: >-
        Forecast results for a multivariate forecaster. Contains an overall
        anomaly score and per-feature forecast outputs.
    SingleForecasterResult:
      type: object
      properties:
        timestamps:
          type: array
          description: Forecast timestamps for the predicted horizon.
          example:
            - '2025-12-31 10:00:00'
            - '2025-12-31 11:00:00'
          items:
            type: string
            description: Forecast timestamps for the predicted horizon.
            example: '["2025-12-31 10:00:00","2025-12-31 11:00:00"]'
        predictions:
          type: array
          description: Predicted values for the feature.
          example:
            - 20.7
            - 20.9
          items:
            type: number
            description: Predicted values for the feature.
            format: double
        upperConfidence:
          type: array
          description: Upper confidence bound per predicted point.
          example:
            - 21.3
            - 21.4
          items:
            type: number
            description: Upper confidence bound per predicted point.
            format: double
        lowerConfidence:
          type: array
          description: Lower confidence bound per predicted point.
          example:
            - 20.1
            - 20.4
          items:
            type: number
            description: Lower confidence bound per predicted point.
            format: double
        anomalyScore:
          type: number
          description: Anomaly score for this feature at prediction time.
          format: double
          example: 0.12
        forecastingMethod:
          type: string
          description: 'Forecasting method used for this feature (e.g., CLUSTER, FALLBACK).'
          example: CLUSTER
        numberOfClusters:
          type: integer
          description: >-
            Number of clusters used/available for this feature at prediction
            time.
          format: int32
          example: 4
      description: Forecast output for a single feature.
      example:
        temperature:
          timestamps:
            - '2025-12-31 10:00:00'
          predictions:
            - 20.7
          upperConfidence:
            - 21.3
          lowerConfidence:
            - 20.1
          anomalyScore: 0.12
          forecastingMethod: CLUSTER
          numberOfClusters: 4
    ObjectInformation:
      type: object
      properties:
        objectId:
          type: string
          description: Unique identifier of the object.
          example: object-7e4b1a21
        objectName:
          type: string
          description: Human-readable name assigned to the object.
          example: Web Traffic Forecaster
        createdAt:
          type: string
          description: 'Date when the object was created, in format YYYY-MM-DD.'
          example: '2025-09-14'
        createdBy:
          type: string
          description: Developer token that created the object.
          example: VfYZ3hLQk6FohdPTkKXB0lC30DworzI5Mz....
        objectType:
          type: string
          description: >-
            Type or category of the object (e.g., 'FORECASTER', 'OFFLINE
            DETECTOR', 'DATASET', etc).
          example: FORECASTER
        dataProcessed:
          type: number
          description: >-
            Amount of data processed by the object expressed in
            MB(human-readable).
          format: double
        requestsProcessed:
          type: integer
          description: Number of API or internal requests handled by this object.
          format: int64
          example: 328
      description: >-
        Represents a tracked object in the DriftMind system, including metadata
        and statistics.
      example:
        objectId: 1ae577ed-e104-4206-89e4-f9f17017d14c
        objectName: RecorderTest_Minimal
        createdAt: '2026-01-31'
        createdBy: 
          Wl4SjAhdXbpq8EzTjOVYJuHFYxy2LTE4ODDg3MTY1NzEzNDU3NTE2NT0g4OTM1NDUzMTc5NjE3NzE3MjAxMw
        objectType: FORECASTER
        dataProcessed: -0.01
        requestsProcessed: 1
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      description: Authentication token tied to the customer account.
      name: Auth
      in: header
