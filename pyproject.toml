[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftmind"
version = "0.5.0"
description = "Python client and demo utilities for DriftMind forecasting API"
authors = [
    { name = "Thingbook.io", email = "roman.f@thingbook.io" }
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["forecasting", "anomaly-detection", "time-series", "online-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.32.4",
    "python-dotenv>=1.0.1",
    "python-dateutil>=2.9.0.post0",
    "pydantic>=2.10.6",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "responses>=0.23.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
    "jsonschema>=4.0.0",
    "openapi-core>=0.19.0",
    "openapi-spec-validator>=0.7.1",
]

[project.optional-dependencies]
examples = [
    "jupyterlab>=4.3.8",
    "plotly>=5.0.0",
    "numpy>=1.24.4,!=2.4.0",
    "pandas>=2.0.3",
    "matplotlib>=3.7.5",
]
all = [
    "driftmind[examples]"
]

[project.urls]
Repository = "https://github.com/thngbk/driftmind"

[tool.hatch.build.targets.wheel]
packages = ["src/driftmind"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/driftmind/data/openapi.yaml",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# Added 'PYI' for type-hinting checks and 'TID' for tidier imports
select = ["E", "W", "F", "I", "B", "UP", "PYI", "TID"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["driftmind"]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports from parent modules
ban-relative-imports = "parents"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (run against real API)",
]
addopts = [
    "--cov=driftmind",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--strict-markers",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/driftmind/__init__.py",
    "src/driftmind/exceptions.py",
    "src/driftmind/utils/demo.py",
]

[tool.uv]
# Ensures your lockfile stays consistent across your Windows and Ubuntu machines
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]
